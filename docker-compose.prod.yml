# Production stack: one server, four containers.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Only the web container is published; Postgres, the API and the AI
# service are reachable only on the internal Docker network.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aibi_db}
      POSTGRES_USER: ${POSTGRES_USER:-aibi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aibi_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aibi_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aibi_db}
      DB_USER: ${POSTGRES_USER:-aibi_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      AI_SERVICE_URL: http://ai-service:8000
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
