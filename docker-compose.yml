services:
  # ── PostgreSQL + pgvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aibi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aibi_db
      POSTGRES_USER: aibi_user
      POSTGRES_PASSWORD: aibi_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibi_user -d aibi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
