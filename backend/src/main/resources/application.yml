server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # trust X-Forwarded-* from the nginx proxy

spring:
  application:
    name: aibi-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/aibi_db}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
    username: ${DB_USER:aibi_user}
    password: ${DB_PASSWORD:aibi_secret_2024}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Schema managed by init.sql, not Hibernate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ── JWT Configuration ──
app:
  jwt:
    secret: ${JWT_SECRET:AIBI-DSS-JWT-SECRET-KEY-CHANGE-IN-PRODUCTION-2024-MIN-256-BITS!!}
    expiration-ms: 86400000       # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── AI Service URL ──
aibi:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-key: ${INTERNAL_API_KEY:}

# ── Logging ──
logging:
  level:
    com.aibi: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
